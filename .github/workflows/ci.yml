name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
      - name: Smoke-test the CLI against the runner's hardware
        if: runner.os == 'Windows'
        run: |
          cargo run -q -p awd-cli -- scan
          cargo run -q -p awd-cli -- scan --all --json --output scan.json
          cargo run -q -p awd-cli -- scan --input scan.json --problems
      - name: Smoke-test the CLI against the sample report
        if: runner.os == 'Linux'
        run: cargo run -q -p awd-cli -- scan --input tests/fixtures/scan-sample.json

  cross-check:
    name: cargo check for Windows from Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc
      - run: cargo check --workspace --all-targets --target aarch64-pc-windows-msvc

  deny:
    name: cargo deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
